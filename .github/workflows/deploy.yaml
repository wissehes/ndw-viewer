name: Build & Verify

# Only main-branch commits and PRs targeting main run here. Only main-branch
# pushes publish a `main-<run>-<sha>` tag, which is the only tag Flux's
# ImagePolicy matches — PR builds cannot deploy even if merged in error.
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    IMAGE: ghcr.io/wissehes/ndw-viewer

jobs:
    build:
        runs-on: ndw-viewer-runners
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v3

            - name: Build & push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # Three tags:
                  #   :<sha>                        always — pinned artefact
                  #   :latest / :pr-N               convenience
                  #   :main-<run>-<sha>             ONLY on push to main — Flux tracks this
                  tags: |
                      ${{ env.IMAGE }}:${{ github.sha }}
                      ${{ github.event_name == 'pull_request' && format('{0}:pr-{1}', env.IMAGE, github.event.pull_request.number) || format('{0}:latest', env.IMAGE) }}
                      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('{0}:main-{1}-{2}', env.IMAGE, github.run_number, github.sha) || '' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    verify-deploy:
        name: Verify deploy
        needs: build
        runs-on: ndw-viewer-runners
        # Guard #1: only main pushes attempt to observe a deploy. PR runs stop
        # after `build`. Combined with the tag-pattern filter in Flux's
        # ImagePolicy, PRs are structurally incapable of reaching production.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            deployments: write  # for the GitHub Deployment status API
        env:
            EXPECTED_TAG: main-${{ github.run_number }}-${{ github.sha }}
            NAMESPACE: ndw
            DEPLOYMENT: ndw-viewer
        steps:
            # Create a GitHub Deployment so the repo Environments tab shows
            # a live rollout indicator. `initial-status: in_progress` skips
            # the transient `queued` state.
            - name: Create GitHub deployment
              id: deployment
              uses: chrnorm/deployment-action@v2
              with:
                  token: ${{ github.token }}
                  environment: production
                  environment-url: https://ndw.wisse.dev
                  ref: ${{ github.sha }}
                  initial-status: in_progress
                  description: "Waiting for Flux to roll out ${{ env.EXPECTED_TAG }}"

            - uses: azure/setup-kubectl@v4

            # Runner pods mount the ndw-viewer-deployer SA (read-only on ns/ndw)
            # — kubectl picks it up from /var/run/secrets automatically.
            - name: Wait for Flux to bump the Deployment image
              run: |
                  echo "Expecting Deployment $NAMESPACE/$DEPLOYMENT to run tag :$EXPECTED_TAG"
                  for i in $(seq 1 60); do
                    CURRENT=$(kubectl -n "$NAMESPACE" get deployment "$DEPLOYMENT" \
                      -o jsonpath="{.spec.template.spec.containers[?(@.name=='$DEPLOYMENT')].image}" \
                      2>/dev/null || echo "not-found")
                    echo "  [$(date -u +%H:%M:%S)] attempt $i/60: $CURRENT"
                    if [[ "$CURRENT" == *":$EXPECTED_TAG" ]]; then
                      echo "Flux picked up this build."
                      exit 0
                    fi
                    sleep 10
                  done
                  echo "::error::Timed out after 10 min waiting for Flux to update the Deployment"
                  exit 1

            - name: Wait for rollout to complete
              run: kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=5m

            - name: Show final pod status
              if: always()
              run: kubectl -n "$NAMESPACE" get pods -l app=ndw-viewer -o wide

            - name: Mark deployment successful
              if: success()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  environment-url: https://ndw.wisse.dev
                  state: success

            - name: Mark deployment failed
              if: failure() || cancelled()
              uses: chrnorm/deployment-status@v2
              with:
                  token: ${{ github.token }}
                  deployment-id: ${{ steps.deployment.outputs.deployment_id }}
                  state: failure
