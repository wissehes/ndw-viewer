services:
  app:
    image: ghcr.io/wissehes/ndw-viewer:latest
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.services.ndw-viewer.loadbalancer.server.port=3000
      - traefik.http.routers.ndw-viewer.rule=Host(`ndw.wisse.dev`)
      - traefik.http.routers.ndw-viewer.entrypoints=websecure
    networks:
      - ndw-viewer
    environment:
      - MAPTILER_STYLE_URL=${MAPTILER_STYLE_URL}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        monitor: 30s
        failure_action: rollback
      restart_policy:
        condition: on-failure

    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ndw-viewer:
    driver: overlay